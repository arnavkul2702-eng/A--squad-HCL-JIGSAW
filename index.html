<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum-Grid Autonomous Dual-Harvest Smart Truck | HCL Jigsaw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="cyberpunk"] {
            --bg-grad: linear-gradient(135deg, #090a0f 0%, #121824 50%, #1a0b2e 100%);
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(0, 243, 255, 0.3);
            --primary: #00f3ff;
            --secondary: #ff007f;
            --accent: #39ff14;
            --text-main: #f0f4f8;
        }
        body { background: var(--bg-grad); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); }
        .glow-btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
        .tab-btn.active { background: var(--primary); color: #090a0f; font-weight: 700; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto space-y-6">

    <header class="glass-card p-4 rounded-2xl flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="font-orbitron font-black text-xl text-cyan-400">QUANTUM-GRID SMART TRUCK</h1>
            <p class="text-xs text-slate-400">HCL Jigsaw | Team A-Squad</p>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('sim')" id="btn-sim" class="tab-btn active px-4 py-2 rounded-xl text-xs font-bold transition">Simulation</button>
            <button onclick="switchTab('team')" id="btn-team" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-300 transition">Team A-Squad</button>
        </div>
    </header>

    <!-- SIMULATION TAB -->
    <section id="tab-sim" class="glass-card p-6 rounded-2xl space-y-4">
        <div class="flex justify-between items-center flex-wrap gap-2">
            <h2 class="font-orbitron font-bold text-cyan-400 text-base"><i class="fa-solid fa-wind mr-2"></i> Solar Roof & Micro-Turbine Simulation</h2>
            <span class="px-3 py-1 bg-cyan-500/20 text-cyan-400 rounded-lg text-xs font-mono" id="speed-label">Speed: 65 KM/H</span>
        </div>

        <div class="relative w-full h-[380px] bg-slate-950 rounded-xl overflow-hidden border border-cyan-500/30">
            <canvas id="simCanvas" class="w-full h-full block"></canvas>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <label class="text-xs text-slate-400 block mb-1">Truck Speed</label>
                <input type="range" min="20" max="120" value="65" class="w-full accent-cyan-400" oninput="speed = Number(this.value); document.getElementById('speed-label').innerText = 'Speed: ' + speed + ' KM/H';">
            </div>
            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <label class="text-xs text-slate-400 block mb-1">Sunlight Intensity</label>
                <input type="range" min="0" max="100" value="85" class="w-full accent-amber-400" oninput="sunPower = Number(this.value);">
            </div>
        </div>
    </section>

    <!-- TEAM TAB -->
    <section id="tab-team" class="glass-card p-8 rounded-2xl space-y-6 hidden max-w-xl mx-auto text-center">
        <div class="w-16 h-16 mx-auto rounded-xl glow-btn-primary flex items-center justify-center text-black font-black text-2xl font-orbitron">AS</div>
        <h2 class="font-orbitron font-bold text-2xl text-cyan-400">Team A-Squad</h2>
        <div class="bg-slate-900/60 p-5 rounded-xl border border-cyan-500/30 text-left space-y-3 font-mono text-xs">
            <div class="flex justify-between border-b border-slate-800 pb-2">
                <span class="text-slate-400">Team Coordinator & Idea Generator</span>
                <span class="text-cyan-400 font-bold">Arnav Kulkarni</span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-400">Project Focus</span>
                <span class="text-pink-400 font-bold">Autonomous Dual-Harvest Smart Truck</span>
            </div>
        </div>
    </section>

    <script>
        function switchTab(tab) {
            document.getElementById('tab-sim').classList.toggle('hidden', tab !== 'sim');
            document.getElementById('tab-team').classList.toggle('hidden', tab !== 'team');
            document.getElementById('btn-sim').classList.toggle('active', tab === 'sim');
            document.getElementById('btn-team').classList.toggle('active', tab === 'team');
        }

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let speed = 65;
        let sunPower = 85;
        let roadOffset = 0;
        let turbineAngle = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Sky background
            ctx.fillStyle = '#090a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road
            let roadY = canvas.height - 80;
            ctx.fillStyle = '#121824';
            ctx.fillRect(0, roadY, canvas.width, 80);

            // Road lines
            roadOffset = (roadOffset + speed * 0.1) % 40;
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(0, roadY + 40);
            ctx.lineTo(canvas.width, roadY + 40);
            ctx.stroke();
            ctx.setLineDash([]);

            // Truck coordinates
            let truckX = canvas.width / 2 - 100;
            let truckY = roadY - 70;

            // Trailer body
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            ctx.fillRect(truckX - 90, truckY, 180, 50);
            ctx.strokeRect(truckX - 90, truckY, 180, 50);

            // Solar Roof Panels
            ctx.fillStyle = sunPower > 0 ? '#f59e0b' : '#334155';
            for(let i=0; i<5; i++) {
                ctx.fillRect(truckX - 80 + (i * 32), truckY - 4, 26, 4);
            }

            // Cab
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(truckX + 90, truckY - 10, 65, 60);
            ctx.strokeRect(truckX + 90, truckY - 10, 65, 60);

            // Wind Turbine in front bumper
            turbineAngle += speed * 0.15;
            let turbX = truckX + 155;
            let turbY = truckY + 30;
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(turbX, turbY, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(turbX, turbY);
            ctx.rotate(turbineAngle);
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            for(let b=0; b<3; b++) {
                ctx.rotate((Math.PI * 2) / 3);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -8);
                ctx.stroke();
            }
            ctx.restore();

            // Wheels
            [truckX - 70, truckX - 40, truckX + 30, truckX + 100, truckX + 135].forEach(wx => {
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(wx, roadY, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#39ff14';
                ctx.lineWidth = 3;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
